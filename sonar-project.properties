sonar.projectKey=TrustVC_trustvc-cli
sonar.organization=trustvc

sonar.sources=src
sonar.tests=tests,src
sonar.test.inclusions=tests/**,src/**/*.test.ts,src/**/*.test.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/.coverage/**,tests/fixtures/**
sonar.coverage.exclusions=tests/**,**/*.test.ts,**/*.test.js

sonar.javascript.lcov.reportPaths=.coverage/lcov.info
